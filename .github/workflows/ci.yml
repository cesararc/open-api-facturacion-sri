name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-build:
    name: Tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Mismo flag que usa el Dockerfile
      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  lint:
    name: Lint (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # El código arrastra deuda de lint anterior a este workflow (formato y reglas
    # no-unsafe-*). Hasta sanearla, este job reporta pero no bloquea el merge.
    # Para volverlo obligatorio: quitar continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps --no-audit --no-fund

      - run: npm run lint:check
